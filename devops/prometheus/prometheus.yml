global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: b2u-backend-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          environment: local
          service: b2u-backend

  - job_name: b2u-backend-docker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          environment: docker
          service: b2u-backend
