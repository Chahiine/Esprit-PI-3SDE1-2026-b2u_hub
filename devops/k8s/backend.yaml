apiVersion: apps/v1
kind: Deployment
metadata:
  name: b2u-backend
  namespace: b2u-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: b2u-backend
  template:
    metadata:
      labels:
        app: b2u-backend
    spec:
      containers:
        - name: backend
          image: b2u-hub-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: b2u-backend-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: b2u-hub
spec:
  type: NodePort
  selector:
    app: b2u-backend
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30082
