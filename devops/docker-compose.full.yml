# B2U-HUB — Stack complete : App + Jenkins + SonarQube + Prometheus + Grafana
# Usage : .\devops\start-full-stack.ps1

services:
  # --- Application ---
  postgres:
    image: postgres:16-alpine
    container_name: b2u-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0000"
      POSTGRES_DB: b2u_hub
    ports:
      - "5433:5432"
    volumes:
      - b2u_pg_data:/var/lib/postgresql/data
    networks:
      - b2u-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d b2u_hub"]
      interval: 10s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    image: b2u-hub-backend:latest
    container_name: b2u-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8081"
    networks:
      - b2u-net
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: b2u-hub-frontend:latest
    container_name: b2u-frontend
    depends_on:
      - backend
    ports:
      - "4201:80"
    networks:
      - b2u-net
    restart: unless-stopped

  # --- DevOps ---
  sonar-db:
    image: postgres:15-alpine
    container_name: b2u-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - b2u-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:10.6-community
    container_name: b2u-sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks:
      - b2u-net

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: b2u-jenkins:latest
    container_name: b2u-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    networks:
      - b2u-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: b2u-prometheus
    depends_on:
      - backend
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - b2u-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: b2u-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - b2u-net

volumes:
  b2u_pg_data:
  sonar_db_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  jenkins_home:
  prometheus_data:
  grafana_data:

networks:
  b2u-net:
    name: b2u-net
    driver: bridge
