# Jenkins + SonarQube pour pipeline DevOps (Windows + Docker Desktop)
# Demarrage : docker compose -f devops/docker-compose.devops.yml up -d

services:
  sonar-db:
    image: postgres:15-alpine
    container_name: b2u-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - devops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:10.6-community
    container_name: b2u-sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks:
      - devops-net

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: b2u-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devops-net

volumes:
  sonar_db_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  jenkins_home:

networks:
  devops-net:
    driver: bridge
