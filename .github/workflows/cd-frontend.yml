name: CD Frontend

on:
  workflow_run:
    workflows: ["CI Frontend"]
    types: [completed]
    branches: [ wijden-merge, main ]
  workflow_dispatch:

jobs:
  cd-frontend:
    name: Docker Build & Push Frontend
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/b2u-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/b2u-frontend:${{ github.sha }}

      - name: Notify success
        run: echo "✅ Frontend Docker image pushed successfully!"