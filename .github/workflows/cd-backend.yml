name: CD Backend

on:
  workflow_run:
    workflows: ["CI Backend"]
    types: [completed]
    branches: [ wijden-merge, main ]
  workflow_dispatch:

jobs:
  cd-backend:
    name: Docker Build & Push Backend
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/b2u-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/b2u-backend:${{ github.sha }}

      - name: Notify success
        run: echo "✅ Backend Docker image pushed successfully!"