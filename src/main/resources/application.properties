spring.application.name=PI
spring.datasource.url=jdbc:postgresql://localhost:5432/b2u_hub
spring.datasource.username=postgres
spring.datasource.password=0000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081

# Import config locale optionnelle (Gmail)
spring.config.import=optional:classpath:application-local.properties

# --- E-mail ---
# mode=console : affiche le mail dans IntelliJ (demo validation, pas besoin de Gmail)
# mode=smtp    : envoi reel Gmail (mot de passe application dans application-local.properties)
app.mail.enabled=true
app.mail.mode=console
app.mail.from=sassichahine68@gmail.com

# --- Gemini IA (clé dans application-local.properties) ---
app.ai.gemini.enabled=false
app.ai.gemini.model=gemini-2.5-flash
