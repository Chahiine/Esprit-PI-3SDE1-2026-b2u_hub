<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img src="/eduleb/assets/img/logo.png" alt="B2U Hub" class="auth-logo">
      <h2>Connexion</h2>
      <p>Bienvenue sur B2U Hub</p>
    </div>

    <div class="auth-error" *ngIf="error">⚠️ {{ error }}</div>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email"
               class="form-control" placeholder="vous@exemple.com" required>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" [(ngModel)]="password" name="password"
               class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-auth" [disabled]="loading">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <div class="auth-divider"><span>ou</span></div>

    <!-- Google OAuth2 -->
    <a href="http://localhost:8081/oauth2/authorization/google"
       style="display:flex;align-items:center;justify-content:center;gap:10px;
              padding:11px 24px;border:1px solid #ddd;border-radius:8px;
              background:#fff;color:#333;font-size:.9rem;
              text-decoration:none;cursor:pointer;margin-bottom:1rem;
              transition:box-shadow .2s"
       onmouseover="this.style.boxShadow='0 2px 8px rgba(0,0,0,.12)'"
       onmouseout="this.style.boxShadow='none'">
      <img src="https://www.google.com/favicon.ico" width="20" height="20" alt="Google">
      Continuer avec Google
    </a>

    <p class="auth-footer">
      Pas encore de compte ? <a routerLink="/register">Créer un compte</a>
    </p>
  </div>
</div>
