<div class="profile-page" *ngIf="user() as u">

  <div class="alert-success-msg" *ngIf="successMsg">✅ {{ successMsg }}</div>
  <div class="alert-error-msg"   *ngIf="errorMsg">⚠️ {{ errorMsg }}</div>

  <!-- Header -->
  <div class="profile-header">
    <div class="avatar-wrap">
      <div class="avatar">
        <img *ngIf="u.profileImageUrl" [src]="u.profileImageUrl" [alt]="u.firstName">
        <span *ngIf="!u.profileImageUrl">{{ getInitials() }}</span>
      </div>
      <label class="avatar-upload-btn" title="Changer la photo">
        <span>{{ imageUploading ? '...' : '📷' }}</span>
        <input type="file" accept="image/*" (change)="onImageSelected($event)" hidden>
      </label>
    </div>

    <div class="profile-info">
      <h1>{{ u.firstName }} {{ u.lastName }}</h1>
      <span class="role-badge role-{{ u.role.toLowerCase() }}">{{ u.role }}</span>
      <p *ngIf="u.bio" class="bio">{{ u.bio }}</p>
      <p class="email">📧 {{ u.email }}</p>
    </div>

    <div class="profile-actions">
      <button class="btn-edit" (click)="startEdit()" *ngIf="!editing">✏️ Modifier</button>
      <button class="btn-logout" (click)="logout()">🚪 Déconnexion</button>
    </div>
  </div>

  <!-- Skills -->
  <div class="profile-section" *ngIf="skillsList.length > 0 && !editing">
    <h3>Compétences</h3>
    <div class="skills-list">
      <span class="skill-chip" *ngFor="let s of skillsList">{{ s }}</span>
    </div>
  </div>

  <!-- CV -->
  <div class="profile-section">
    <h3>CV / Resume</h3>
    <div class="cv-area">

      <!-- View CV — opens Cloudinary URL directly in new tab -->
      <a *ngIf="u.cvUrl"
         [href]="u.cvUrl"
         target="_blank"
         rel="noopener noreferrer"
         class="btn-cv">
        📄 View CV
      </a>

      <p *ngIf="!u.cvUrl" class="text-muted-sm">Aucun CV uploadé.</p>

      <!-- Upload CV -->
      <label class="btn-upload-cv">
        {{ cvUploading ? 'Upload en cours...' : (u.cvUrl ? '⬆️ Remplacer le CV' : '⬆️ Uploader CV') }}
        <input type="file" accept=".pdf,.doc,.docx" (change)="onCvSelected($event)" hidden>
      </label>

    </div>
  </div>

  <!-- Edit Form -->
  <div class="profile-section" *ngIf="editing">
    <h3>Modifier le profil</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" [(ngModel)]="firstName" class="form-control">
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" [(ngModel)]="lastName" class="form-control">
      </div>
    </div>
    <div class="form-group">
      <label>Bio</label>
      <textarea [(ngModel)]="bio" class="form-control" rows="3" placeholder="Parlez de vous..."></textarea>
    </div>
    <div class="form-group">
      <label>Compétences <small>(séparées par virgule)</small></label>
      <input type="text" [(ngModel)]="skills" class="form-control" placeholder="Java, Spring, Angular">
    </div>
    <div class="form-actions">
      <button class="btn-save" (click)="saveProfile()">💾 Enregistrer</button>
      <button class="btn-cancel" (click)="cancelEdit()">Annuler</button>
    </div>
  </div>

  <!-- Password -->
  <div class="profile-section">
    <h3>
      Sécurité
      <button class="btn-toggle" (click)="showPassword = !showPassword">
        {{ showPassword ? 'Annuler' : 'Changer le mot de passe' }}
      </button>
    </h3>
    <div *ngIf="showPassword" class="password-form">
      <div class="form-group">
        <label>Mot de passe actuel</label>
        <input type="password" [(ngModel)]="currentPassword" class="form-control">
      </div>
      <div class="form-group">
        <label>Nouveau mot de passe</label>
        <input type="password" [(ngModel)]="newPassword" class="form-control">
      </div>
      <div class="form-group">
        <label>Confirmer</label>
        <input type="password" [(ngModel)]="confirmPassword" class="form-control">
      </div>
      <button class="btn-save" (click)="savePassword()">Mettre à jour</button>
    </div>
  </div>

</div>
