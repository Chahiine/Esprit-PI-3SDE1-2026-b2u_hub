<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img src="/eduleb/assets/img/logo.png" alt="B2U Hub" class="auth-logo">
      <h2>Créer un compte</h2>
      <p>Rejoignez B2U Hub</p>
    </div>

    <div class="auth-error" *ngIf="error">⚠️ {{ error }}</div>

    <form (ngSubmit)="submit()">
      <div class="form-row">
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" [(ngModel)]="firstName" name="firstName" class="form-control" placeholder="John" required>
        </div>
        <div class="form-group">
          <label>Nom</label>
          <input type="text" [(ngModel)]="lastName" name="lastName" class="form-control" placeholder="Doe" required>
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="vous@exemple.com" required>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="Min. 6 caractères" required>
      </div>
      <div class="form-group">
        <label>Je suis...</label>
        <div class="role-toggle">
          <button type="button" [class.active]="role==='STUDENT'" (click)="role='STUDENT'">🎓 Étudiant</button>
          <button type="button" [class.active]="role==='COMPANY'" (click)="role='COMPANY'">🏢 Entreprise</button>
        </div>
      </div>
      <button type="submit" class="btn-auth" [disabled]="loading">
        {{ loading ? 'Création...' : 'Créer mon compte' }}
      </button>
    </form>

    <p class="auth-footer">Déjà inscrit ? <a routerLink="/login">Se connecter</a></p>
  </div>
</div>
